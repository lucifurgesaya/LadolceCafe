<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
LaDolce Cafe CMS PRO MAX
</title>

<link rel="icon" href="logo.ico">

<!-- TAILWIND -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- GOOGLE FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet"
/>

<style>

*{
  font-family:'Inter',sans-serif;
}

body{
  background:#f7f4ef;
  color:#2B1C16;
  overflow-x:hidden;
}

.glass{
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.75);
}

.card{
  background:white;
  border-radius:32px;
  padding:32px;
  box-shadow:
  0 10px 30px rgba(0,0,0,0.05);
}

.input{
  width:100%;
  border:1px solid #e5e5e5;
  padding:16px;
  border-radius:18px;
  margin-top:10px;
  outline:none;
  transition:0.3s;
}

.input:focus{
  border-color:#800000;
  box-shadow:
  0 0 0 4px rgba(128,0,0,0.1);
}

.btn{
  transition:0.3s;
  font-weight:700;
}

.btn:hover{
  transform:
  translateY(-2px)
  scale(1.02);
}

.preview-image{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:24px;
  margin-top:18px;
  border:2px solid #f1f1f1;
}

iframe{
  border:none;
}

.badge{
  background:#800000;
  color:white;
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 glass border-b border-black/5">

<div class="max-w-[1800px] mx-auto px-6 py-5 flex justify-between items-center">

<div>

<p class="uppercase tracking-[0.3em] text-[#800000] text-xs font-bold">
LaDolce Cafe
</p>

<h1 class="text-4xl font-black mt-2">
CMS Dashboard
</h1>

</div>

<div class="flex gap-4">

<a
href="index.html"
target="_blank"
class="bg-[#2B1C16] text-white px-6 py-3 rounded-2xl btn"
>
Open Website
</a>

<button
onclick="refreshPreview()"
class="bg-[#800000] text-white px-6 py-3 rounded-2xl btn"
>
Refresh Preview
</button>

</div>

</div>

</nav>

<!-- MAIN -->
<main class="max-w-[1800px] mx-auto px-6 py-10">

<div class="grid xl:grid-cols-2 gap-10">

<!-- LEFT -->
<div class="space-y-10">

<!-- HERO -->
<section class="card">

<div class="mb-8">

<div class="badge">
Website Branding
</div>

<h2 class="text-5xl font-black mt-4">
Hero Section
</h2>

</div>

<div class="space-y-6">

<!-- LOGO -->
<div>

<label class="font-semibold">
Cafe Logo
</label>

<input
id="logoImage"
type="file"
accept="image/*"
class="input"
onchange="previewImage('logoImage','logoPreview')"
/>

<img
id="logoPreview"
class="preview-image"
/>

</div>

<!-- HERO BG -->
<div>

<label class="font-semibold">
Hero Background
</label>

<input
id="heroImage"
type="file"
accept="image/*"
class="input"
onchange="previewImage('heroImage','heroPreview')"
/>

<img
id="heroPreview"
class="preview-image"
/>

</div>

<!-- TITLE -->
<div>

<label class="font-semibold">
Hero Title
</label>

<input
id="heroTitle"
type="text"
placeholder="Authentic Filipino Cuisine"
class="input"
/>

</div>

<!-- DESCRIPTION -->
<div>

<label class="font-semibold">
Hero Description
</label>

<textarea
id="heroDesc"
rows="5"
placeholder="Welcome to LaDolce Cafe..."
class="input"
></textarea>

</div>

<button
onclick="updateWebsiteSettings()"
class="bg-[#800000] text-white w-full py-5 rounded-2xl btn text-lg"
>
Save Hero Section
</button>

</div>

</section>

<!-- ABOUT -->
<section class="card">

<div class="mb-8">

<div class="badge">
About Section
</div>

<h2 class="text-5xl font-black mt-4">
About LaDolce Cafe
</h2>

</div>

<textarea
id="aboutText"
rows="8"
placeholder="About your cafe..."
class="input"
></textarea>

<button
onclick="updateWebsiteSettings()"
class="bg-[#2B1C16] text-white w-full py-5 rounded-2xl btn text-lg mt-6"
>
Save About Section
</button>

</section>

<!-- CONTACT -->
<section class="card">

<div class="mb-8">

<div class="badge">
Contact Information
</div>

<h2 class="text-5xl font-black mt-4">
Cafe Contact
</h2>

</div>

<div class="space-y-5">

<input
id="phone"
type="text"
placeholder="Phone Number"
class="input"
/>

<input
id="address"
type="text"
placeholder="Cafe Address"
class="input"
/>

<input
id="facebook"
type="text"
placeholder="Facebook Link"
class="input"
/>

<input
id="openingHours"
type="text"
placeholder="10:00 AM - 10:00 PM"
class="input"
/>

<button
onclick="updateWebsiteSettings()"
class="bg-[#800000] text-white w-full py-5 rounded-2xl btn text-lg"
>
Save Contact Info
</button>

</div>

</section>

<!-- MENU -->
<section class="card">

<div class="mb-8">

<div class="badge">
Menu System
</div>

<h2 class="text-5xl font-black mt-4">
Add Menu Item
</h2>

</div>

<div class="space-y-5">

<input
id="menuName"
type="text"
placeholder="Menu Name"
class="input"
/>

<input
id="menuPrice"
type="number"
placeholder="Price"
class="input"
/>

<input
id="menuCategory"
type="text"
placeholder="Category"
class="input"
/>

<textarea
id="menuDescription"
rows="4"
placeholder="Menu Description"
class="input"
></textarea>

<input
id="menuImage"
type="file"
accept="image/*"
class="input"
/>

<button
onclick="addMenu()"
class="bg-green-700 text-white w-full py-5 rounded-2xl btn text-lg"
>
Add Menu Item
</button>

</div>

<div
id="menuList"
class="grid gap-5 mt-10"
></div>

</section>

<!-- GALLERY -->
<section class="card">

<div class="mb-8">

<div class="badge">
Gallery
</div>

<h2 class="text-5xl font-black mt-4">
Cafe Photos
</h2>

</div>

<input
id="galleryImage"
type="file"
accept="image/*"
class="input"
/>

<button
onclick="uploadGallery()"
class="bg-[#800000] text-white w-full py-5 rounded-2xl btn text-lg mt-6"
>
Upload Gallery Image
</button>

<div
id="galleryList"
class="grid md:grid-cols-3 gap-4 mt-10"
></div>

</section>

</div>

<!-- RIGHT -->
<div class="sticky top-28 h-[92vh]">

<div class="bg-white rounded-[2.5rem] overflow-hidden shadow-2xl h-full">

<div class="flex justify-between items-center px-6 py-5 border-b">

<div>

<h2 class="text-3xl font-black">
Live Website Preview
</h2>

<p class="text-gray-500 mt-1">
Real-time frontend preview
</p>

</div>

<button
onclick="refreshPreview()"
class="bg-[#800000] text-white px-5 py-3 rounded-2xl btn"
>
Refresh
</button>

</div>

<iframe
id="previewFrame"
src="index.html"
class="w-full h-full bg-white"
></iframe>

</div>

</div>

</div>

</main>

<!-- ADMIN JS -->
<script src="admin.js"></script>

</body>
</html>
