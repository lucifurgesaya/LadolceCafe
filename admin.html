<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LaDolce Cafe | PRO CMS</title>

<link rel="icon" href="logos.ico">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#800000;
  --secondary:#228B22;
  --cream:#F5F5DC;
  --brown:#8B4513;
  --dark:#2B1C16;
}

body{
  background:var(--cream);
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

input,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:5px;
}

button{
  transition:.2s;
}
button:hover{
  transform:scale(1.03);
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="bg-[#2B1C16] text-white px-6 py-4 flex justify-between items-center">
<h1 class="text-2xl font-black">LaDolce Cafe CMS PRO</h1>

<div class="flex gap-3">
<a href="index.html" target="_blank"
class="bg-[#800000] px-4 py-2 rounded-xl">
Open Website
</a>

<button onclick="refreshPreview()"
class="bg-white text-black px-4 py-2 rounded-xl">
Refresh Live
</button>
</div>
</header>

<!-- MAIN GRID -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">

<!-- LEFT PANEL (CONTROLS) -->
<div class="space-y-6">

<!-- HERO -->
<div class="card">
<h2 class="font-black text-xl">Hero Section</h2>

<input id="heroTitle" placeholder="Hero Title">
<textarea id="heroDesc" placeholder="Hero Description"></textarea>

<input type="file" id="heroImage">

<button onclick="updateHero()"
class="mt-3 bg-[#800000] text-white px-4 py-2 rounded-xl">
Update Hero
</button>
</div>

<!-- ABOUT -->
<div class="card">
<h2 class="font-black text-xl">About</h2>
<textarea id="aboutText"></textarea>

<button onclick="updateAbout()"
class="mt-3 bg-green-700 text-white px-4 py-2 rounded-xl">
Save About
</button>
</div>

<!-- CONTACT -->
<div class="card">
<h2 class="font-black text-xl">Contact</h2>

<input id="phone" placeholder="Phone">
<input id="address" placeholder="Address">
<input id="facebook" placeholder="Facebook">

<button onclick="updateContact()"
class="mt-3 bg-[#800000] text-white px-4 py-2 rounded-xl">
Save Contact
</button>
</div>

<!-- MENU -->
<div class="card">
<h2 class="font-black text-xl">Menu</h2>

<input id="menuName" placeholder="Food Name">
<input id="menuPrice" placeholder="Price">
<textarea id="menuDesc" placeholder="Description"></textarea>
<input type="file" id="menuImage">

<button onclick="addMenu()"
class="mt-3 bg-green-700 text-white px-4 py-2 rounded-xl">
Add Food
</button>

<div id="menuList" class="grid grid-cols-2 gap-3 mt-4"></div>
</div>

<!-- GALLERY -->
<div class="card">
<h2 class="font-black text-xl">Gallery</h2>

<input type="file" id="galleryImage">

<button onclick="uploadGallery()"
class="mt-3 bg-[#800000] text-white px-4 py-2 rounded-xl">
Upload
</button>

<div id="galleryList" class="grid grid-cols-3 gap-2 mt-4"></div>
</div>

</div>

<!-- RIGHT PANEL (LIVE PREVIEW) -->
<div class="card h-[90vh] sticky top-4">

<div class="flex justify-between items-center mb-3">
<h2 class="font-black text-xl">LIVE WEBSITE</h2>
</div>

<iframe
id="previewFrame"
src="index.html"
class="w-full h-full rounded-xl border">
</iframe>

</div>

</div>

<!-- SUPABASE -->
<script>
const SUPABASE_URL="https://fflnpsiutikdywibbltj.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_WLoDWwjyE2FctbWEoYYSng_qOjZn4hX";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);
</script>

<!-- CMS LOGIC -->
<script>

/* REFRESH LIVE */
function refreshPreview(){
document.getElementById("previewFrame").src =
document.getElementById("previewFrame").src;
}

/* UPLOAD FILE */
async function uploadFile(file){
const name = Date.now()+"-"+file.name;

await supabaseClient.storage
.from("kuya-dan-media")
.upload(name,file);

const { data } = supabaseClient.storage
.from("kuya-dan-media")
.getPublicUrl(name);

return data.publicUrl;
}

/* HERO */
async function updateHero(){
const file=document.getElementById("heroImage").files[0];
let img=null;
if(file) img=await uploadFile(file);

await supabaseClient.from("website_settings")
.update({
hero_title:heroTitle.value,
hero_description:heroDesc.value,
hero_image:img
}).eq("id",1);

refreshPreview();
}

/* ABOUT */
async function updateAbout(){
await supabaseClient.from("website_settings")
.update({
about_text:aboutText.value
}).eq("id",1);

refreshPreview();
}

/* CONTACT */
async function updateContact(){
await supabaseClient.from("website_settings")
.update({
phone:phone.value,
address:address.value,
facebook:facebook.value
}).eq("id",1);

refreshPreview();
}

/* MENU */
async function addMenu(){
const file=menuImage.files[0];
let img="";
if(file) img=await uploadFile(file);

await supabaseClient.from("menu_items")
.insert([{
name:menuName.value,
price:menuPrice.value,
description:menuDesc.value,
image_url:img
}]);

loadMenu();
refreshPreview();
}

async function loadMenu(){
const {data}=await supabaseClient.from("menu_items").select("*");

menuList.innerHTML="";
data?.forEach(i=>{
menuList.innerHTML+=`
<div class="bg-white p-2 rounded-lg shadow">
<img src="${i.image_url}" class="h-20 w-full object-cover rounded"/>
<p class="font-bold">${i.name}</p>
<p>₱${i.price}</p>
</div>`;
});
}

/* GALLERY */
async function uploadGallery(){
const file=galleryImage.files[0];
const url=await uploadFile(file);

await supabaseClient.from("gallery")
.insert([{image_url:url}]);

loadGallery();
refreshPreview();
}

async function loadGallery(){
const {data}=await supabaseClient.from("gallery").select("*");

galleryList.innerHTML="";
data?.forEach(i=>{
galleryList.innerHTML+=`
<img src="${i.image_url}" class="h-20 w-full object-cover rounded"/>`;
});
}

/* INIT */
loadMenu();
loadGallery();

</script>

</body>
</html>
