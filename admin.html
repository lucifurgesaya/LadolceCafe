<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LaDolce Cafe | FULL CMS PRO</title>

<link rel="icon" href="logos.ico">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{background:#F5F5DC;font-family:sans-serif;}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
}

input,textarea{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-top:5px;
}

button{transition:.2s}
button:hover{transform:scale(1.03)}
</style>
</head>

<body>

<!-- HEADER -->
<header class="bg-[#2B1C16] text-white flex justify-between p-4">
<h1 class="font-black text-xl">LaDolce CMS PRO MAX</h1>

<div class="flex gap-2">
<a href="index.html" target="_blank"
class="bg-[#800000] px-4 py-2 rounded-xl">Open Site</a>

<button onclick="refreshPreview()"
class="bg-white text-black px-4 py-2 rounded-xl">
Refresh
</button>
</div>
</header>

<!-- GRID -->
<div class="grid lg:grid-cols-2 gap-6 p-6">

<!-- LEFT -->
<div class="space-y-6">

<!-- HERO -->
<div class="card">
<h2 class="font-black">Hero</h2>
<input id="heroTitle" placeholder="Title">
<textarea id="heroDesc" placeholder="Description"></textarea>
<input type="file" id="heroImage">

<button onclick="updateHero()" class="mt-3 bg-[#800000] text-white px-4 py-2 rounded-xl">
Update Hero
</button>
</div>

<!-- ABOUT -->
<div class="card">
<h2 class="font-black">About</h2>
<textarea id="aboutText"></textarea>
<button onclick="updateAbout()" class="mt-3 bg-green-700 text-white px-4 py-2 rounded-xl">
Save
</button>
</div>

<!-- CONTACT -->
<div class="card">
<h2 class="font-black">Contact</h2>
<input id="phone">
<input id="address">
<input id="facebook">

<button onclick="updateContact()" class="mt-3 bg-[#800000] text-white px-4 py-2 rounded-xl">
Save
</button>
</div>

<!-- MENU (FULL CONTROL) -->
<div class="card">
<h2 class="font-black">Menu (Edit / Delete)</h2>

<input id="menuName">
<input id="menuPrice">
<textarea id="menuDesc"></textarea>
<input type="file" id="menuImage">

<button onclick="addMenu()" class="mt-3 bg-green-700 text-white px-4 py-2 rounded-xl">
Add Item
</button>

<div id="menuList" class="mt-4 space-y-2"></div>
</div>

<!-- GALLERY -->
<div class="card">
<h2 class="font-black">Gallery</h2>

<input type="file" id="galleryImage">

<button onclick="uploadGallery()" class="mt-3 bg-[#800000] text-white px-4 py-2 rounded-xl">
Upload
</button>

<div id="galleryList" class="grid grid-cols-3 gap-2 mt-4"></div>
</div>

</div>

<!-- RIGHT -->
<div class="card h-[90vh] sticky top-4">
<h2 class="font-black mb-2">LIVE PREVIEW</h2>
<iframe id="previewFrame" src="index.html" class="w-full h-full border rounded-xl"></iframe>
</div>

</div>

<script>
const SUPABASE_URL="https://fflnpsiutikdywibbltj.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_WLoDWwjyE2FctbWEoYYSng_qOjZn4hX";

const supabaseClient = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* LIVE REFRESH */
function refreshPreview(){
document.getElementById("previewFrame").src+="?";
}

/* UPLOAD */
async function uploadFile(file){
const name=Date.now()+"-"+file.name;

await supabaseClient.storage
.from("kuya-dan-media")
.upload(name,file);

const {data}=supabaseClient.storage
.from("kuya-dan-media")
.getPublicUrl(name);

return data.publicUrl;
}

/* HERO */
async function updateHero(){
let img=null;
if(heroImage.files[0]) img=await uploadFile(heroImage.files[0]);

await supabaseClient.from("website_settings")
.update({
hero_title:heroTitle.value,
hero_description:heroDesc.value,
hero_image:img
}).eq("id",1);

refreshPreview();
}

/* ABOUT */
async function updateAbout(){
await supabaseClient.from("website_settings")
.update({about_text:aboutText.value}).eq("id",1);

refreshPreview();
}

/* CONTACT */
async function updateContact(){
await supabaseClient.from("website_settings")
.update({
phone:phone.value,
address:address.value,
facebook:facebook.value
}).eq("id",1);

refreshPreview();
}

/* MENU ADD */
async function addMenu(){
let img="";
if(menuImage.files[0]) img=await uploadFile(menuImage.files[0]);

await supabaseClient.from("menu_items")
.insert([{
name:menuName.value,
price:menuPrice.value,
description:menuDesc.value,
image_url:img
}]);

loadMenu();
refreshPreview();
}

/* LOAD MENU */
async function loadMenu(){
const {data}=await supabaseClient.from("menu_items").select("*");

menuList.innerHTML="";
data?.forEach(i=>{
menuList.innerHTML+=`
<div class="bg-white p-2 rounded-lg shadow flex justify-between items-center">
<div>
<p class="font-bold">${i.name}</p>
<p>₱${i.price}</p>
</div>

<div class="flex gap-2">
<button onclick="deleteMenu(${i.id})" class="text-red-600">X</button>
</div>
</div>`;
});
}

/* DELETE MENU */
async function deleteMenu(id){
await supabaseClient.from("menu_items").delete().eq("id",id);
loadMenu();
refreshPreview();
}

/* GALLERY */
async function uploadGallery(){
const url=await uploadFile(galleryImage.files[0]);

await supabaseClient.from("gallery")
.insert([{image_url:url}]);

loadGallery();
refreshPreview();
}

/* LOAD GALLERY */
async function loadGallery(){
const {data}=await supabaseClient.from("gallery").select("*");

galleryList.innerHTML="";
data?.forEach(i=>{
galleryList.innerHTML+=`
<div class="relative">
<img src="${i.image_url}" class="rounded-lg h-20 w-full object-cover">
<button onclick="deleteGallery(${i.id})"
class="absolute top-1 right-1 bg-red-600 text-white px-2 rounded">X</button>
</div>`;
});
}

/* DELETE GALLERY */
async function deleteGallery(id){
await supabaseClient.from("gallery").delete().eq("id",id);
loadGallery();
refreshPreview();
}

/* INIT */
loadMenu();
loadGallery();

</script>

</body>
</html>
