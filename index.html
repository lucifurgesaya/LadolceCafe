<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LaDolce Cafe</title>

<link rel="icon" href="logo.ico">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html { scroll-behavior: smooth; }

body{
  background:#F5F5DC;
  color:#2b1c16;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background-size:cover;
  background-position:center;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background: rgba(43,28,22,.65);
}

.hero-content{
  position:relative;
  z-index:2;
}

/* CARD */
.card-hover{ transition:.3s; }
.card-hover:hover{ transform:translateY(-6px); }

.section{
  padding:90px 20px;
  max-width:1200px;
  margin:auto;
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="fixed w-full z-50 bg-white/80 backdrop-blur border-b">
<div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
<h1 class="font-black text-xl">LaDolce Cafe</h1>
<div class="hidden md:flex gap-6 text-sm font-semibold">
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#menu">Menu</a>
<a href="#gallery">Gallery</a>
</div>
</div>
</nav>

<!-- HERO -->
<section id="home" class="hero"
style="background-image:url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb');">

<div class="hero-content max-w-3xl px-6">
<h1 id="hero-title" class="text-5xl font-black">LaDolce Cafe</h1>
<p id="hero-content" class="mt-6 text-lg">Loading...</p>
</div>
</section>

<!-- ABOUT -->
<section id="about" class="section">
<h2 class="text-4xl font-black mb-6">About</h2>
<p>Authentic Filipino Cuisine served with love.</p>
</section>

<!-- MENU -->
<section id="menu" class="section">
<h2 class="text-4xl font-black mb-10">Menu</h2>
<div id="menu-container" class="grid md:grid-cols-3 gap-6"></div>
</section>

<!-- GALLERY -->
<section id="gallery" class="section">
<h2 class="text-4xl font-black mb-10">Gallery</h2>
<div id="gallery-container" class="grid md:grid-cols-4 gap-4"></div>
</section>

<script>
const SUPABASE_URL = "https://fflnpsiutikdywibbltj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WLoDWwjyE2FctbWEoYYSng_qOjZn4hX";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadHero(){

  const { data } = await supabaseClient
    .from("website_settings")
    .select("*")
    .eq("id", 1)
    .maybeSingle();

  if(!data) return;

  document.getElementById("hero-title").innerText =
    data.hero_title || "LaDolce Cafe";

  document.getElementById("hero-content").innerText =
    data.hero_description || "";

  // 🔥 FORCE APPLY IMAGE (NO CONDITIONS)
  if(data.hero_image){
    document.getElementById("home").style.backgroundImage =
      `linear-gradient(rgba(43,28,22,.65),rgba(43,28,22,.65)), url('${data.hero_image}')`;
  }
}

async function loadMenu(){

  const { data } = await supabaseClient
    .from("menu_items")
    .select("*")
    .order("created_at",{ascending:false});

  const container = document.getElementById("menu-container");
  container.innerHTML = "";

  data?.forEach(item=>{
    container.innerHTML += `
      <div class="bg-white rounded-2xl shadow p-4 card-hover">
        ${item.image_url ? `<img src="${item.image_url}" class="h-52 w-full object-cover rounded-xl"/>` : ""}
        <h3 class="text-xl font-bold mt-3">${item.name}</h3>
        <p class="text-gray-600">${item.description || ""}</p>
        <p class="font-black text-[#800000] mt-2">₱${item.price}</p>
      </div>
    `;
  });
}

async function loadGallery(){

  const { data } = await supabaseClient
    .from("gallery")
    .select("*")
    .order("created_at",{ascending:false});

  const container = document.getElementById("gallery-container");
  container.innerHTML = "";

  data?.forEach(img=>{
    container.innerHTML += `
      <img src="${img.image_url}" class="rounded-xl h-48 w-full object-cover"/>
    `;
  });
}

loadHero();
loadMenu();
loadGallery();
</script>

</body>
</html>
